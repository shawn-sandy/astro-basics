<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Astro Basics</title>
  <style>
    :root {
      --bg:         #ffffff;
      --surface:    #f9fafb;
      --border:     #e5e7eb;
      --border-mid: #d1d5db;
      --text:       #111827;
      --muted:      #6b7280;
      --subtle:     #9ca3af;
      --accent:     #2563eb;
      --accent-bg:  #eff6ff;
      --radius:     4px;
      --shadow:     0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 15px;
      min-height: 100vh;
      padding: 32px;
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
    }

    /* ── Skip link ──────────────────────────────────────────────── */
    .skip-link {
      position: absolute;
      left: -9999px; top: auto;
      width: 1px; height: 1px;
      overflow: hidden;
    }
    .skip-link:focus {
      position: fixed;
      left: 1rem; top: 1rem;
      width: auto; height: auto;
      overflow: visible;
      background: var(--accent);
      color: #fff;
      padding: .5rem 1rem;
      border-radius: var(--radius);
      font-weight: 700;
      z-index: 9999;
      text-decoration: none;
    }

    /* ── Header ──────────────────────────────────────────────────── */
    .gallery-header {
      max-width: 1200px;
      margin: 0 auto 32px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }
    .gallery-header::before {
      content: "";
      display: block;
      height: 3px;
      background: var(--accent);
      margin-bottom: 20px;
      border-radius: 2px;
    }
    .gallery-header h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -.02em;
      margin-bottom: 4px;
    }
    .gallery-header p {
      font-size: 13px;
      color: var(--muted);
    }

    /* ── Card grid ───────────────────────────────────────────────── */
    .gallery-grid {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    @media (max-width: 640px) {
      .gallery-grid {
        grid-template-columns: 1fr;
      }
    }

    /* ── Cards ───────────────────────────────────────────────────── */
    .gallery-card {
      display: block;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      text-decoration: none;
      color: var(--text);
      box-shadow: var(--shadow);
      transition: border-color .15s, box-shadow .15s;
    }
    .gallery-card:hover {
      border-color: var(--accent);
      box-shadow: 0 4px 12px rgba(0,0,0,.08);
    }
    .gallery-card:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    @media (prefers-reduced-motion: reduce) {
      .gallery-card { transition: none; }
    }

    .gallery-card .card-title {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 6px;
      letter-spacing: -.01em;
    }
    .gallery-card .card-description {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.5;
    }

    /* ── Footer ──────────────────────────────────────────────────── */
    .gallery-footer {
      max-width: 1200px;
      margin: 48px auto 0;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--subtle);
      text-align: center;
    }
  </style>
</head>
<body>

<a href="#main" class="skip-link">Skip to content</a>

<header class="gallery-header">
  <h1>Astro Basics</h1>
  <p>Browse generated plans and project docs.</p>
</header>

<main id="main">
  <div class="gallery-grid">

    <a class="gallery-card" href="plans/index.html">
      <div class="card-title">Plans</div>
      <div class="card-description">Browse implementation plans for features, fixes, and infrastructure changes.</div>
    </a>

  </div>
</main>

<footer class="gallery-footer">
  Astro Basics
</footer>

</body>
</html>
