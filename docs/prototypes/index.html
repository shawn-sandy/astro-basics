<!DOCTYPE html>
<!--
  prototypes-gallery.html — Prototypes library index for plan-agent.

  Static variables (substituted by build-prototypes-index.sh):
    GALLERY_ENTRIES  — Repeated <a> blocks, one per prototype file
    PROTO_COUNT      — Total number of prototypes displayed
    GENERATED_AT     — Date and time of gallery generation
    HREF_HOME / HREF_PLANS / HREF_PROTOTYPES / HREF_ARTIFACTS / HREF_SOCIAL
                     — Topbar tab targets, each computed relative to THIS page's
                       own output directory (the plans gallery is not always at
                       docs/plans — plansDirectory is configurable)
    COUNT_PLANS / COUNT_PROTOTYPES / COUNT_ARTIFACTS / COUNT_SOCIAL
                     — Topbar tab counts, read off disk by the generator
    CUR_HOME / CUR_PLANS / CUR_PROTOTYPES / CUR_ARTIFACTS / CUR_SOCIAL
                     — Exactly one is replaced with aria-current="page";
                       the rest with the empty string

  Token set, theme script, and topbar are the same shell plans-gallery.html
  carries. Keep them in step: the topbar links these pages to each other, and
  a tab that lands on a differently-styled page reads as a broken link.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prototypes Library</title>
  <script>
    /* Before first paint — see the same note in the plan shell. */
    try {
      var t = localStorage.getItem('plan-theme');
      if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
    } catch (e) { /* no storage — prefers-color-scheme decides */ }
  </script>
  <style>
    /* ── Design tokens — the same palette the generated plans use ──── */
    :root {
      --paper: #fcfcfa;
      --panel: #ffffff;
      --sunk: #f5f4f1;
      --ink: #16151c;
      --ink-2: #4b4858;
      --ink-3: #6e6a80;
      --rule: #e6e3ec;
      --rule-soft: #f0eef4;
      --accent: #4a2fe0;
      --accent-soft: #efebfe;
      --accent-line: #c9befb;
      --radius: 4px;
      --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
      --ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --prose: Georgia, "Iowan Old Style", "Times New Roman", serif;
      color-scheme: light;
    }
    /* Written twice: an explicit choice has to beat the OS preference, and
       plain CSS cannot share a block between an attribute selector and a
       media query. Keep the two lists in sync. */
    :root[data-theme="dark"] {
      --paper: #121118;
      --panel: #1a1922;
      --sunk: #201f29;
      --ink: #edebf3;
      --ink-2: #b3afc4;
      --ink-3: #8b87a0;
      --rule: #2c2a38;
      --rule-soft: #24232e;
      --accent: #a594ff;
      --accent-soft: #221f36;
      --accent-line: #4a4270;
      color-scheme: dark;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --paper: #121118;
        --panel: #1a1922;
        --sunk: #201f29;
        --ink: #edebf3;
        --ink-2: #b3afc4;
        --ink-3: #8b87a0;
        --rule: #2c2a38;
        --rule-soft: #24232e;
        --accent: #a594ff;
        --accent-soft: #221f36;
        --accent-line: #4a4270;
        color-scheme: dark;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: var(--ui);
      font-size: 16px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      padding: 2rem 1.5rem 5rem;
    }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

    /* ── Topbar ──────────────────────────────────────────────────────
       Full-bleed against the body padding; the negative margins cancel it. */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      margin: -2rem -1.5rem 1.5rem;
      border-bottom: 1px solid var(--rule);
      /* Opaque first: a browser without color-mix drops the second
         declaration, and a transparent sticky bar over scrolled text is
         unreadable. */
      background: var(--paper);
      background: color-mix(in srgb, var(--paper) 88%, transparent);
      backdrop-filter: blur(12px);
    }
    .topbar-in {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1.5rem;
      display: flex;
      align-items: center;
      gap: 1.5rem;
      min-height: 48px;
      flex-wrap: wrap;
    }
    .mark {
      font-family: var(--mono);
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      text-decoration: none;
      color: var(--ink);
    }
    .mark::before { content: "\25A4 "; color: var(--accent); }
    .tabs { display: flex; flex-wrap: wrap; gap: 0.25rem; margin-left: auto; }
    .tabs a {
      font-family: var(--mono);
      font-size: 0.7rem;
      letter-spacing: 0.04em;
      padding: 0.4rem 0.6rem;
      border-radius: 3px;
      text-decoration: none;
      color: var(--ink-2);
    }
    .tabs a:hover { color: var(--ink); background: var(--sunk); }
    .tabs a[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }
    .tabs a .n { color: var(--ink-3); margin-left: 0.3rem; }
    /* --ink-3 on the current tab's accent-soft chip measures 4.46:1, just
       under AA — the count takes the tab's own colour there instead. */
    .tabs a[aria-current="page"] .n { color: var(--accent); }

    /* ── Header ──────────────────────────────────────────────────────── */
    .gallery-header {
      max-width: 1200px;
      margin: 0 auto 1.5rem;
      border-bottom: 1px solid var(--rule);
      padding-bottom: 1rem;
      display: flex;
      align-items: flex-end;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .gallery-header h1 {
      font-family: var(--mono);
      font-size: clamp(1.5rem, 4vw, 2rem);
      font-weight: 600;
      letter-spacing: -0.035em;
      line-height: 1.12;
    }
    .gallery-header p {
      font-family: var(--prose);
      font-size: 1.0625rem;
      color: var(--ink-2);
      max-width: 52ch;
      line-height: 1.6;
      margin-top: 0.5rem;
    }
    .theme-toggle {
      margin-left: auto;
      min-width: 44px;
      min-height: 44px;
      padding: 0.4rem 0.9rem;
      font-family: var(--mono);
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-2);
      background: var(--panel);
      border: 1px solid var(--rule);
      border-radius: var(--radius);
      cursor: pointer;
    }
    .theme-toggle:hover { color: var(--accent); border-color: var(--accent-line); }

    .toolbar { max-width: 1200px; margin: 0 auto 1.25rem; display: flex; flex-wrap: wrap; align-items: center; gap: 0.6rem; }
    .search-box {
      flex: 1 1 16rem;
      min-width: 12rem;
      min-height: 44px;
      padding: 0.5rem 0.75rem;
      background: var(--panel);
      border: 1px solid var(--rule);
      border-radius: var(--radius);
      color: var(--ink);
      font-family: var(--ui);
      font-size: 0.875rem;
    }
    .search-box::placeholder { color: var(--ink-3); }
    .search-box:focus { border-color: var(--accent); outline: none; }

    /* ── Row list ────────────────────────────────────────────────────
       Prototype rows carry no status, so the glyph column the plans gallery
       leads with is absent here. */
    .gallery-grid { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 1fr; }
    .gallery-card {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 12rem 5.5rem;
      gap: 0.25rem 0.9rem;
      align-items: baseline;
      padding: 0.65rem 0.5rem;
      text-decoration: none;
      color: inherit;
      border-bottom: 1px solid var(--rule-soft);
    }
    .gallery-card:hover { background: var(--sunk); }
    .r-title { font-size: 0.95rem; line-height: 1.4; color: var(--ink); }
    .r-meta {
      font-family: var(--mono);
      font-size: 0.65rem;
      color: var(--ink-3);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .r-date { font-family: var(--mono); font-size: 0.65rem; color: var(--ink-3); text-align: right; }
    @media (max-width: 700px) {
      .gallery-card { grid-template-columns: minmax(0, 1fr) 5.5rem; }
      .r-meta { grid-column: 1 / -1; }
    }

    .no-results {
      display: none;
      max-width: 1200px;
      margin: 2rem auto;
      padding: 2rem;
      text-align: center;
      border: 1px dashed var(--rule);
      border-radius: var(--radius);
      color: var(--ink-3);
    }
    .gallery-footer {
      max-width: 1200px;
      margin: 3rem auto 0;
      padding-top: 1rem;
      border-top: 1px solid var(--rule);
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.75rem;
      font-family: var(--mono);
      font-size: 0.65rem;
      color: var(--ink-3);
    }
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="topbar-in">
      <a class="mark" href="../index.html">agentics</a>
      <nav class="tabs" aria-label="Collections">
        <a href="../index.html" >Home</a>
        <a href="../plans/index.html" >Plans<span class="n">3</span></a>
        <a href="index.html" aria-current="page">Prototypes<span class="n">1</span></a>
        <a href="../artifacts/index.html" >Artifacts<span class="n">0</span></a>
        <a href="../media/social/index.html" >Social<span class="n">0</span></a>
      </nav>
    </div>
  </header>

  <div class="gallery-header">
    <div>
      <h1>Prototypes Library</h1>
      <p>1 prototypes &mdash; clickable proofs of plans, newest first.</p>
    </div>
    <button
      class="theme-toggle"
      type="button"
      id="themeToggle"
      aria-pressed="false"
      aria-label="Use dark theme"
    >
      Dark
    </button>
  </div>

  <div class="toolbar">
    <input type="search" class="search-box" id="searchBox"
           placeholder="Search by title..." aria-label="Search prototypes by title">
  </div>

  <div class="gallery-grid" id="galleryGrid"><a class="gallery-card" href="restyle-astro-kit-homepage.html"
   data-month="2026-08" data-title="restyle astro kit homepage">
  <span class="r-title">Restyle Astro Kit homepage</span>
  <span class="r-meta">restyle-astro-kit-homepage.html</span>
  <span class="r-date">2026-08-05</span>
</a></div>

  <div class="no-results" id="noResults">No prototypes yet.</div>

  <div class="gallery-footer">
    <span>1 prototypes</span>
    <span>Generated 2026-08-05 15:57</span>
  </div>

  <script>
    var grid      = document.getElementById('galleryGrid');
    var cards     = grid.querySelectorAll('.gallery-card');
    var noResults = document.getElementById('noResults');

    function applyFilter(text) {
      var shown = 0;
      for (var i = 0; i < cards.length; i++) {
        var title = cards[i].getAttribute('data-title') || '';
        if (!text || title.indexOf(text) !== -1) { cards[i].style.display = ''; shown++; }
        else { cards[i].style.display = 'none'; }
      }
      noResults.style.display = shown === 0 ? 'block' : 'none';
    }

    document.getElementById('searchBox').addEventListener('input', function () {
      applyFilter(this.value.trim().toLowerCase());
    });

    var themeBtn = document.getElementById('themeToggle');
    function resolvedTheme() {
      var set = document.documentElement.getAttribute('data-theme');
      if (set === 'dark' || set === 'light') return set;
      return window.matchMedia &&
        window.matchMedia('(prefers-color-scheme: dark)').matches
        ? 'dark'
        : 'light';
    }
    function syncThemeButton() {
      var dark = resolvedTheme() === 'dark';
      themeBtn.setAttribute('aria-pressed', dark ? 'true' : 'false');
      themeBtn.setAttribute('aria-label', dark ? 'Use light theme' : 'Use dark theme');
      themeBtn.textContent = dark ? 'Light' : 'Dark';
    }
    themeBtn.addEventListener('click', function () {
      var next = resolvedTheme() === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem('plan-theme', next); } catch (e) { /* not persisted */ }
      syncThemeButton();
    });
    syncThemeButton();

    applyFilter('');
  </script>
</body>
</html>
